name: Publish GESARUTA

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gesaruta-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_HOST"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Publish immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tar --exclude=.git -czf "/tmp/gesaruta-web-${SHA}.tar.gz" .
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /home/pcos/opt/gesaruta-web/releases/${SHA}"
          scp -P "${DEPLOY_PORT:-22}" "/tmp/gesaruta-web-${SHA}.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/gesaruta-web-${SHA}.tar.gz"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "tar -xzf /tmp/gesaruta-web-${SHA}.tar.gz -C /home/pcos/opt/gesaruta-web/releases/${SHA} && ln -sfn /home/pcos/opt/gesaruta-web/releases/${SHA} /home/pcos/opt/gesaruta-web/current && rm -f /tmp/gesaruta-web-${SHA}.tar.gz && find /home/pcos/opt/gesaruta-web/releases -mindepth 1 -maxdepth 1 -type d | sort | head -n -3 | xargs -r rm -rf"

      - name: Smoke test production content
        run: |
          set -eu
          test "$(curl -Ls -o /dev/null -w '%{http_code}' https://gesaruta.com/)" = "200"
